# Test suite on every push and pull request, on Linux and Windows.
# Versions match the reference workstation (Windows 11, Python 3.14.7).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.4 scipy==1.16.3 qiskit==2.2.3 pytest
      - name: Record environment
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          python -m pip freeze
          python -c "import numpy; numpy.show_config()"
      - name: Run tests
        run: python -m pytest -q --basetemp="${{ runner.temp }}/pytest"
